<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공장 상세 | FactoryMap Korea</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;--bg:#F8FAFC;--rose:#FF385C;--rose2:#E11D48;--soft:#FFF1F3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Plus Jakarta Sans','Noto Sans KR',system-ui,sans-serif}
header{background:linear-gradient(135deg,#0F172A 0%,#1E293B 60%,#3B0A1A 100%);color:#fff;padding:22px 24px}
.wrap{max-width:820px;margin:auto}a.back{color:#FFD1DA;text-decoration:none;font-weight:600;font-size:14px}a.back:hover{color:#fff}
.brand{font:800 18px 'Outfit',sans-serif;margin-top:6px}.brand span{color:var(--rose)}
main{max-width:820px;margin:-0px auto 40px;padding:24px 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 40px -15px rgba(15,23,42,.12);overflow:hidden}
.top{padding:28px 28px 20px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:12px;font-weight:700;background:var(--soft);color:var(--rose2);padding:4px 10px;border-radius:999px}.tag.ind{background:#EEF2FF;color:#4338CA}
h1{font:800 28px/1.25 'Outfit','Noto Sans KR',sans-serif;margin:0 0 8px}.addr{color:var(--muted);margin:0}
#map{height:300px;background:#E2E8F0}
dl{display:grid;grid-template-columns:130px 1fr;margin:0;padding:8px 28px 24px}dt,dd{padding:13px 0;border-bottom:1px solid var(--line);margin:0}dt{color:var(--muted);font-size:14px}dd{font-weight:600}
.btns{display:flex;gap:10px;flex-wrap:wrap;padding:0 28px 28px}.btn{flex:1;min-width:150px;text-align:center;padding:12px;border-radius:12px;text-decoration:none;font-weight:700}.btn.p{background:var(--rose);color:#fff}.btn.s{background:var(--soft);color:var(--rose2)}
.note{font-size:12px;color:var(--muted);margin:16px 4px}.empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:600px){.top{padding:22px 20px 16px}h1{font-size:23px}dl{grid-template-columns:100px 1fr;padding:4px 20px 20px}.btns{padding:0 20px 22px}#map{height:240px}}
</style></head><body>
<header><div class="wrap"><a class="back" href="./">← 지도로 돌아가기</a><div class="brand">▣ Factory<span>Map</span> Korea</div></div></header>
<main><div id="root" class="card"><p class="empty">불러오는 중…</p></div>
<p class="note">데이터 출처: 국토교통부 건축HUB 건축물대장정보(표제부, 주용도=공장). 지도 위치는 주소를 지오코딩한 근사 위치라 실제와 다를 수 있어요.</p></main>
<script>
const KAKAO_JS_KEY="53d3a2efe44f300b21e7f1115eec432c";
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function area(v){const n=Number(v);return Number.isFinite(n)&&n>0?n.toLocaleString("ko-KR",{maximumFractionDigits:1})+"㎡ ("+(n/3.305785).toLocaleString("ko-KR",{maximumFractionDigits:1})+"평)":"미확인"}
function date(v){v=String(v||"");return /^\d{8}$/.test(v)?v.slice(0,4)+"."+v.slice(4,6)+"."+v.slice(6):(v||"미확인")}
function show(f){if(!f){document.getElementById("root").innerHTML='<p class="empty">공장 정보를 찾을 수 없어요. <a href="./">지도로 돌아가기</a></p>';return}
document.title=f.name+" | FactoryMap Korea";const ok=Number(f.lat)>=33&&Number(f.lat)<=39&&Number(f.lng)>=124&&Number(f.lng)<=132;
const rows={"주소":f.address||"미확인","지번":f.jibun||"","지역":f.region||"미확인","업종·용도":f.industry||"미확인","대지면적":area(f.land_sqm),"건축면적":area(f.building_sqm),"연면적":f.total_sqm?area(f.total_sqm):"","사용승인일":date(f.approved_at),"건축구조":f.structure||"미확인"};
const q=encodeURIComponent(f.address||f.name);
document.getElementById("root").innerHTML='<div class="top"><div class="tags"><span class="tag">'+safe(f.region||"지역 미확인")+'</span><span class="tag ind">'+safe(f.industry||"업종 미확인")+'</span></div><h1>'+safe(f.name)+'</h1><p class="addr">📍 '+safe(f.address||"주소 미확인")+'</p></div>'+(ok?'<div id="map"></div>':'<p class="empty" style="padding:14px">이 공장은 좌표가 없어 지도 위치를 표시할 수 없어요.</p>')+'<dl>'+Object.entries(rows).filter(([k,v])=>v).map(([k,v])=>'<dt>'+k+'</dt><dd>'+safe(v)+'</dd>').join("")+'</dl><div class="btns"><a class="btn p" href="https://map.kakao.com/?q='+q+'" target="_blank" rel="noopener">카카오맵에서 보기</a><a class="btn s" href="https://map.naver.com/p/search/'+q+'" target="_blank" rel="noopener">네이버지도에서 보기</a><a class="btn s" href="./">← 전체 지도</a></div>';
if(ok){const sc=document.createElement("script");sc.src="https://dapi.kakao.com/v2/maps/sdk.js?appkey="+KAKAO_JS_KEY+"&autoload=false";sc.onload=()=>kakao.maps.load(()=>{const p=new kakao.maps.LatLng(+f.lat,+f.lng);const m=new kakao.maps.Map(document.getElementById("map"),{center:p,level:4});new kakao.maps.Marker({position:p,map:m});m.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT)});sc.onerror=()=>{document.getElementById("map").innerHTML='<iframe title="지도" style="border:0;width:100%;height:100%" src="https://www.openstreetmap.org/export/embed.html?bbox='+(f.lng-.01)+','+(f.lat-.006)+','+(+f.lng+.01)+','+(+f.lat+.006)+'&marker='+f.lat+','+f.lng+'"></iframe>'};document.head.appendChild(sc);setTimeout(()=>{if(!document.querySelector("#map>div,#map>iframe"))sc.onerror()},6000)}}
const id=new URLSearchParams(location.search).get("id");let cached=null;try{cached=JSON.parse(sessionStorage.getItem("fm_factory")||"null")}catch(e){}
fetch("data/factories.json").then(r=>r.json()).then(d=>show(d.find(f=>String(f.pk)===id)||(cached&&String(cached.pk||"")===String(id||"")?cached:null))).catch(()=>show(cached))
</script></body></html>
