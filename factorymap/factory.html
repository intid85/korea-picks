<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공장 상세 | FactoryMap Korea</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;--bg:#F8FAFC;--rose:#FF385C;--rose2:#E11D48;--soft:#FFF1F3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Plus Jakarta Sans','Noto Sans KR',system-ui,sans-serif}
header{background:linear-gradient(135deg,#0F172A 0%,#1E293B 60%,#3B0A1A 100%);color:#fff;padding:22px 24px}
.wrap{max-width:820px;margin:auto}a.back{color:#FFD1DA;text-decoration:none;font-weight:600;font-size:14px}a.back:hover{color:#fff}
.brand{font:800 18px 'Outfit',sans-serif;margin-top:6px}.brand span{color:var(--rose)}
main{max-width:820px;margin:-0px auto 40px;padding:24px 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 40px -15px rgba(15,23,42,.12);overflow:hidden}
.top{padding:28px 28px 20px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:12px;font-weight:700;background:var(--soft);color:var(--rose2);padding:4px 10px;border-radius:999px}.tag.ind{background:#EEF2FF;color:#4338CA}
h1{font:800 28px/1.25 'Outfit','Noto Sans KR',sans-serif;margin:0 0 8px}.addr{color:var(--muted);margin:0}
#map{height:300px;background:#E2E8F0}
dl{display:grid;grid-template-columns:130px 1fr;margin:0;padding:8px 28px 24px}dt,dd{padding:13px 0;border-bottom:1px solid var(--line);margin:0}dt{color:var(--muted);font-size:14px}dd{font-weight:600}
.btns{display:flex;gap:10px;flex-wrap:wrap;padding:0 28px 28px}.btn{flex:1;min-width:150px;text-align:center;padding:12px;border-radius:12px;text-decoration:none;font-weight:700}.btn.p{background:var(--rose);color:#fff}.btn.s{background:var(--soft);color:var(--rose2)}
.mk{margin-top:22px;padding:24px 28px}.mk h2{font:800 20px 'Outfit','Noto Sans KR',sans-serif;margin:0 0 4px}.mk .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.kpi{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12px;color:var(--muted)}.kpi b{display:block;font:800 20px 'Outfit',sans-serif;color:var(--ink)}
.chart h3{font-size:15px;margin:18px 0 6px}.chart svg{width:100%;height:auto;display:block}.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:4px 0}.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:600}td.r,th.r{text-align:right}.tw{overflow-x:auto}
.note{font-size:12px;color:var(--muted);margin:16px 4px}.empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:600px){.mk{padding:20px}.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:17px}.top{padding:22px 20px 16px}h1{font-size:23px}dl{grid-template-columns:100px 1fr;padding:4px 20px 20px}.btns{padding:0 20px 22px}#map{height:240px}}
</style></head><body>
<header><div class="wrap"><a class="back" href="./">← 지도로 돌아가기</a><div class="brand">▣ Factory<span>Map</span> Korea</div></div></header>
<main><div id="root" class="card"><p class="empty">불러오는 중…</p></div>
<div id="market" class="card mk"><h2>📈 주변 공장 실거래가</h2><p class="sub">불러오는 중…</p></div>
<div id="land" class="card mk"><h2>🌾 토지 매매 실거래가</h2><p class="sub">불러오는 중…</p></div>
</main>
<script>
const KAKAO_JS_KEY="53d3a2efe44f300b21e7f1115eec432c";
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function area(v){const n=Number(v);return Number.isFinite(n)&&n>0?n.toLocaleString("ko-KR",{maximumFractionDigits:1})+"㎡ ("+(n/3.305785).toLocaleString("ko-KR",{maximumFractionDigits:1})+"평)":"미확인"}
function date(v){v=String(v||"");return /^\d{8}$/.test(v)?v.slice(0,4)+"."+v.slice(4,6)+"."+v.slice(6):(v||"미확인")}
function show(f){if(!f){document.getElementById("root").innerHTML='<p class="empty">공장 정보를 찾을 수 없어요. <a href="./">지도로 돌아가기</a></p>';return}
const umdN=((String(f.address||"").match(/\(([^)]+)\)/)||[])[1]||"").split(/[ ,]/)[0];const head=[f.region,umdN].filter(Boolean).join(" ")||"공장";document.title=head+" 공장 상세 | FactoryMap Korea";const ok=Number(f.lat)>=33&&Number(f.lat)<=39&&Number(f.lng)>=124&&Number(f.lng)<=132;
const rows={"지역":head,"대지면적":area(f.land_sqm),"건축면적":area(f.building_sqm),"연면적":f.total_sqm?area(f.total_sqm):"","사용승인일":date(f.approved_at),"건축구조":f.structure||"미확인"};if(f.src==="reg"){delete rows["사용승인일"];delete rows["건축구조"];delete rows["연면적"];rows["공장등록일"]=date(f.approved_at);rows["용도지역"]=f.zone||"";rows["공장규모"]=f.scale||"";if(f.jibun)rows["공장등록 주소(지번)"]=f.jibun;if(f.approx)rows["지도 위치"]="리·동 단위 근사 위치"}
const q=encodeURIComponent(f.address||f.name);
document.getElementById("root").innerHTML='<div class="top"><div class="tags"><span class="tag">공장 상세</span></div><h1>'+safe(head)+' 공장</h1><p class="addr">'+(f.src==="reg"?'📍 공장등록 · 등록 ':'📍 사용승인 ')+safe(date(f.approved_at))+'</p></div>'+(ok?'<div id="map"></div>':'<p class="empty" style="padding:14px">이 공장은 좌표가 없어 지도 위치를 표시할 수 없어요.</p>')+'<dl>'+Object.entries(rows).filter(([k,v])=>v).map(([k,v])=>'<dt>'+k+'</dt><dd>'+safe(v)+'</dd>').join("")+'</dl><div class="btns"><a class="btn p" href="https://map.kakao.com/?q='+q+'" target="_blank" rel="noopener">카카오맵에서 보기</a><a class="btn s" href="https://map.naver.com/p/search/'+q+'" target="_blank" rel="noopener">네이버지도에서 보기</a><a class="btn s" href="./">← 전체 지도</a></div>';
if(ok){const sc=document.createElement("script");sc.src="https://dapi.kakao.com/v2/maps/sdk.js?appkey="+KAKAO_JS_KEY+"&autoload=false";sc.onload=()=>kakao.maps.load(()=>{const p=new kakao.maps.LatLng(+f.lat,+f.lng);const m=new kakao.maps.Map(document.getElementById("map"),{center:p,level:4});new kakao.maps.Marker({position:p,map:m});m.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT)});sc.onerror=()=>{document.getElementById("map").innerHTML='<iframe title="지도" style="border:0;width:100%;height:100%" src="https://www.openstreetmap.org/export/embed.html?bbox='+(f.lng-.01)+','+(f.lat-.006)+','+(+f.lng+.01)+','+(+f.lat+.006)+'&marker='+f.lat+','+f.lng+'"></iframe>'};document.head.appendChild(sc);setTimeout(()=>{if(!document.querySelector("#map>div,#map>iframe"))sc.onerror()},6000)}}

const PY=3.305785;
function med(a){a=a.filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2}
function won(m){if(m==null)return"-";return m>=10000?(m/10000).toLocaleString("ko-KR",{maximumFractionDigits:2})+"억":Math.round(m).toLocaleString("ko-KR")+"만"}
function q(ym){const[y,m]=ym.split("-");return y+"-Q"+Math.ceil(+m/3)}
function series(rows,key){const g={};rows.forEach(r=>{const v=key(r);if(Number.isFinite(v)&&v>0)(g[q(r.ym)]=g[q(r.ym)]||[]).push(v)});return g}
function line(title,unit,sets){const qs=[...new Set(sets.flatMap(s=>Object.keys(s.g)))].sort();if(qs.length<2)return'<div class="chart"><h3>'+title+'</h3><p class="sub">그래프를 그릴 만큼 거래가 아직 없어요.</p></div>';
const W=640,H=240,L=58,R=30,T=14,B=34,pts=sets.map(s=>qs.map(k=>s.g[k]?{k,v:med(s.g[k]),n:s.g[k].length}:null));const vs=pts.flat().filter(Boolean).map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);const pad=(hi-lo)*.12||hi*.1||1;lo=Math.max(0,lo-pad);hi+=pad;
const x=i=>L+(qs.length==1?0:i*(W-L-R)/(qs.length-1)),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));let g="";for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#E2E8F0"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" font-size="11" text-anchor="end" fill="#64748B">'+Math.round(v).toLocaleString("ko-KR")+'</text>'}
const step=Math.ceil(qs.length/8);qs.forEach((k,i)=>{if((i%step==0&&qs.length-1-i>=step/2+.5)||i==qs.length-1)g+='<text x="'+x(i)+'" y="'+(H-10)+'" font-size="11" text-anchor="middle" fill="#64748B">'+k.replace("-"," ")+'</text>'});
pts.forEach((p,si)=>{const c=sets[si].c;const d=p.map((o,i)=>o?[x(i),y(o.v)]:null).filter(Boolean);g+='<polyline fill="none" stroke="'+c+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="'+d.map(a=>a.join(",")).join(" ")+'"/>';p.forEach((o,i)=>{if(o)g+='<circle cx="'+x(i)+'" cy="'+y(o.v)+'" r="4" fill="#fff" stroke="'+c+'" stroke-width="2.5"><title>'+o.k+' 중위 '+Math.round(o.v).toLocaleString("ko-KR")+unit+' ('+o.n+'건)</title></circle>'})});
return'<div class="chart"><h3>'+title+'</h3><div class="legend">'+sets.map(s=>'<span><i style="background:'+s.c+'"></i>'+s.name+'</span>').join("")+'<span>단위: '+unit+' · 분기별 중위값</span></div><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+title+' 꺾은선 그래프">'+g+'</svg></div>'}
function market(f,T){const el=document.getElementById("market");const sgg=(String(f.address).match(/(\S+[시군])\s/)||[])[1]||f.region,umd=((String(f.address).match(/\(([^)]+)\)/)||[])[1]||"").split(/[ ,]/)[0];
const all=(T.trades||[]).filter(r=>r.sgg===sgg&&r.use==="공장"&&!r.share&&r.amt>0);if(!all.length){el.innerHTML='<h2>📈 주변 공장 실거래가</h2><p class="sub">'+safe(sgg||"이 지역")+'의 공장 실거래 자료가 아직 없어요. (실거래가 준비 중)</p>';return}
const loc=umd?all.filter(r=>r.umd.split(" ")[0]===umd):[];const yr=new Date();yr.setMonth(yr.getMonth()-12);const ys=yr.toISOString().slice(0,7);const last=all.filter(r=>r.ym>=ys),lastL=loc.filter(r=>r.ym>=ys);
const pb=r=>r.bar>0?r.amt/(r.bar/PY):NaN,pl=r=>r.lar>0?r.amt/(r.lar/PY):NaN;const S=(rs,k)=>series(rs,k);
const sets=k=>[{name:sgg+" 전체",c:"#FF385C",g:S(all,k)}].concat(loc.length?[{name:umd,c:"#4338CA",g:S(loc,k)}]:[]);
const recent=(loc.length?loc:all).slice(-10).reverse();
el.innerHTML='<h2>📈 주변 공장 실거래가</h2><p class="sub">'+safe(sgg)+(umd?' · '+safe(umd):'')+' 공장 매매 실거래 기준 (지분거래·해제건 제외) · 갱신 '+safe(T.updated||"")+'</p>'
+'<div class="kpis"><div class="kpi">최근 12개월 거래<b>'+last.length+'건</b>'+(umd?safe(umd)+' '+lastL.length+'건':'')+'</div><div class="kpi">건물 평당 중위가<b>'+won(med(last.map(pb)))+'</b>원/평 · 최근 12개월</div><div class="kpi">공장거래 대지 환산 평당가<b>'+won(med(last.map(pl)))+'</b>원/평 · 최근 12개월</div></div>'
+line("건물면적 기준 평당가 추이","만원/평",sets(pb))+line("공장거래 대지면적 환산 평당가 추이","만원/평",sets(pl))+line("거래금액 추이","만원",sets(r=>r.amt))
+'<h3 style="font-size:15px;margin:20px 0 0">최근 거래 '+(loc.length?'('+safe(umd)+')':'('+safe(sgg)+')')+'</h3><div class="tw"><table><tr><th>거래월</th><th>위치</th><th class="r">거래금액</th><th class="r">건물</th><th class="r">대지</th><th class="r">건축년도</th></tr>'+recent.map(r=>'<tr><td>'+r.ym+'</td><td>'+safe(r.umd)+'</td><td class="r">'+won(r.amt)+'원</td><td class="r">'+(r.bar?Math.round(r.bar/PY).toLocaleString()+'평':'-')+'</td><td class="r">'+(r.lar?Math.round(r.lar/PY).toLocaleString()+'평':'-')+'</td><td class="r">'+safe(r.by||"-")+'</td></tr>').join("")+'</table></div><p class="sub" style="margin-top:10px">※ 실제 신고된 거래만 표시하며, 이 공장 자체의 시세가 아닌 주변 시세 참고용이에요.</p>'}

function landMarket(f,T){const el=document.getElementById("land");const H='<h2>🌾 토지 매매 실거래가</h2>';const sgg=(String(f.address).match(/(\S+[시군])\s/)||[])[1]||f.region,umd=((String(f.address).match(/\(([^)]+)\)/)||[])[1]||"").split(/[ ,]/)[0];
const all=(T.trades||[]).filter(r=>r.sgg===sgg&&r.amt>0&&r.ar>0);if(!all.length){el.innerHTML=H+'<p class="sub">'+safe(sgg||"이 지역")+'의 토지 실거래 자료가 아직 없어요.</p>';return}
const ind=all.filter(r=>/공업/.test(r.land)||r.jimok==="공장용지"),loc=umd?all.filter(r=>r.umd.split(" ")[0]===umd):[];const d=new Date();d.setMonth(d.getMonth()-12);const ys=d.toISOString().slice(0,7);const L=a=>a.filter(r=>r.ym>=ys);
const pp=r=>r.amt/(r.ar/PY);const sets=[{name:sgg+" 전체 토지",c:"#FF385C",g:series(all,pp)}].concat(loc.length?[{name:umd+" 토지",c:"#4338CA",g:series(loc,pp)}]:[]).concat(ind.length?[{name:sgg+" 공업지역·공장용지",c:"#F59E0B",g:series(ind,pp)}]:[]);
const recent=(loc.length?loc:all).slice(-10).reverse();
el.innerHTML=H+'<p class="sub">'+safe(sgg)+(umd?' · '+safe(umd):'')+' 토지 매매 실거래 기준 (지분거래·해제건 제외) · 갱신 '+safe(T.updated||"")+'<br>※ 위 공장 거래의 대지 환산값이 아니라, 실제 토지만 거래된 신고 자료예요.</p>'
+'<div class="kpis"><div class="kpi">최근 12개월 토지 거래<b>'+L(all).length.toLocaleString()+'건</b>'+(umd?safe(umd)+' '+L(loc).length+'건':'')+'</div><div class="kpi">'+safe(sgg)+' 토지 평당 중위가<b>'+won(med(L(all).map(pp)))+'</b>원/평 · 최근 12개월</div><div class="kpi">공업지역·공장용지 평당 중위가<b>'+won(med(L(ind).map(pp)))+'</b>원/평 · '+L(ind).length+'건</div></div>'
+line("토지 평당가 추이","만원/평",sets)
+'<h3 style="font-size:15px;margin:20px 0 0">최근 토지 거래 ('+safe(loc.length?umd:sgg)+')</h3><div class="tw"><table><tr><th>거래월</th><th>위치</th><th>지목</th><th>용도지역</th><th class="r">거래금액</th><th class="r">면적</th><th class="r">평당가</th></tr>'+recent.map(r=>'<tr><td>'+r.ym+'</td><td>'+safe(r.umd)+'</td><td>'+safe(r.jimok||"-")+'</td><td>'+safe(r.land||"-")+'</td><td class="r">'+won(r.amt)+'원</td><td class="r">'+Math.round(r.ar/PY).toLocaleString()+'평</td><td class="r">'+won(pp(r))+'원</td></tr>').join("")+'</table></div>'}
const id=new URLSearchParams(location.search).get("id");let cached=null;try{cached=JSON.parse(sessionStorage.getItem("fm_factory")||"null")}catch(e){}
fetch("data/factories.json").then(r=>r.json()).then(d=>{const f=d.find(f=>String(f.pk)===id)||(cached&&String(cached.pk||"")===String(id||"")?cached:null);show(f);if(f)fetch("data/trades.json").then(r=>r.json()).then(T=>{if(Array.isArray(T.trades))T.trades=T.trades.filter(r=>!(r.bar>0)||r.bar/3.305785>=60);market(f,T)}).catch(()=>{document.getElementById("market").innerHTML='<h2>📈 주변 공장 실거래가</h2><p class="sub">실거래가 준비 중이에요.</p>'});if(f)fetch("data/land_trades.json").then(r=>r.json()).then(T=>{if(Array.isArray(T.trades))T.trades=T.trades.filter(r=>["계획관리지역","자연녹지지역","생산관리지역"].includes(r.land)&&r.jimok!=="도로"&&r.ar/3.305785>=300);landMarket(f,T)}).catch(()=>{document.getElementById("land").innerHTML='<h2>🌾 토지 매매 실거래가</h2><p class="sub">토지 실거래가 준비 중이에요.</p>'});else{document.getElementById("market").remove();document.getElementById("land").remove()}}).catch(()=>show(cached))
</script></body></html>
